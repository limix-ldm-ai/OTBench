# Quantile LightGBM: one model per level. The grid contains the exact 0.025 /
# 0.05 / 0.95 / 0.975 tails the interval metrics need, so no interpolation is
# ever required to build a 90% or 95% interval.

[model]
quantile_levels = [0.025, 0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95, 0.975]
n_estimators = 500
learning_rate = 0.05
num_leaves = 31
n_jobs = -1

[train]
early_stopping_rounds = 50
