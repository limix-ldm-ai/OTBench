# Forest-VP strict-joint family member.  Defaults match forest_vp, but this
# configuration produces an independent checkpoint: the target is modeled as a
# regular column and is never supplied through upstream's label_y argument.

[model]
n_t = 50
duplicate_K = 100
n_estimators = 100
max_depth = 7
eta = 0.3
tree_method = "hist"
gpu_hist = true
# GPU training must not launch joblib workers that all contend for one device.
n_jobs = 1
xgboost_nthread = 1

[impute]
repaint = true
repaint_r = 5
repaint_j = 0.1
batch_rows = 256

[generate]
batch_rows = 1024

[predict]

[train]
