# TabDiff — parameter definition (unified sections).
#
# Value provenance: the original repo's tabdiff/configs/tabdiff_configs.toml
# (sections [unimodmlp_params]/[diffusion_params]/[train.main]/[sample]
# transcribed into the unified [model]/[train]/[sample]/[impute] layout; the
# adapter maps them back to the original parameter names). Imputation-guidance
# defaults (w_num/w_cat/resample_rounds/impute_condition) come from the
# original main.py argparse defaults.

[model]
# UniModMLP backbone
num_layers = 2
d_token = 4
n_head = 1
factor = 32
bias = true
dim_t = 1024
use_mlp = true
# diffusion process
num_timesteps = 50
scheduler = "power_mean"        # per-column learnable variant applied automatically unless non_learnable_schedule
cat_scheduler = "log_linear"
noise_dist = "uniform_t"
non_learnable_schedule = false
stochastic_sampler = true
second_order_correction = true
precond = true
sigma_data = 1.0
net_conditioning = "sigma"
P_mean = -1.2
P_std = 1.2
sigma_min = 0.002
sigma_max = 80
rho = 7
eps_max = 1e-3
eps_min = 1e-5
rho_init = 7.0
rho_offset = 5.0
k_init = -6.0
k_offset = 1.0
dequant_dist = "none"
int_dequant_factor = 0

[train]
steps = 8000
lr = 0.001
weight_decay = 0
ema_decay = 0.997
batch_size = 4096
check_val_every = 2000
lr_scheduler = "reduce_lr_on_plateau"
factor = 0.90
reduce_lr_patience = 50
closs_weight_schedule = "anneal"
c_lambda = 1.0
d_lambda = 1.0
train_y_only = true             # also train the y_only guidance model (needed for imputation/prediction guidance)

[sample]
batch_size = 10000

[impute]
trials = 5
resample_rounds = 1
impute_condition = "x_t"
w_num = 0.6
w_cat = 0.6
