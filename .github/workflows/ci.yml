name: Core and distributions
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install --upgrade pip setuptools wheel build
      - run: python -m pip install -c requirements/constraints.txt -e '.[test]'
      - run: python -m pytest -p no:cacheprovider -m 'not optional_backend and not optional_metric'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python -m build --no-isolation
      - run: python tests/check_release_artifacts.py dist
      - name: Check wheel console entrypoint in a clean environment
        run: |
          python -m venv /tmp/otbench-wheel
          /tmp/otbench-wheel/bin/python -m pip install -c requirements/constraints.txt dist/*.whl
          cd /tmp
          /tmp/otbench-wheel/bin/otbench --list-methods
