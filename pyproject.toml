[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otbench-tabular"
version = "0.1.0"
description = "Tabular generation, imputation, and prediction benchmark"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE.txt"}
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
otbench = "otbench.run:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/core.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
test = {file = ["requirements/test.txt"]}
data = {file = ["requirements/data.txt"]}
metrics = {file = ["requirements/metrics.txt"]}

